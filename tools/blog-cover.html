<!doctype html>
<!-- The blog's cover template (1200 x 630, the size link previews use). Pure visuals, no words: a drawing of the app
     on a solid color, with the color set by the post's category. tools/blog-cover.mjs fills it from JSON in the
     address's hash: {title, category, kind, logo, name}.
     Colors: Forms green (mint when the title says "Alternatives"), Scheduling blue, Routing black, Workflows orange,
     Integrations mint.
     Kinds (the scene): form, meeting, workflow, integration, responses, route, robin, logic. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; -webkit-font-smoothing: antialiased; }
  /* Drawn at 1600 x 840, then scaled to 1200 x 630 */
  .cover { position: absolute; left: 0; top: 0; width: 1600px; height: 840px; transform: scale(.75); transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(var(--soft) 2.5px, transparent 2.5px); background-size: 40px 40px; }
  .blob { position: absolute; border-radius: 50%; background: var(--soft); }
  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 36px; box-shadow: 0 2px 0 rgba(0,0,0,.04), 0 40px 100px rgba(0,0,0,.20); position: relative; }
  .tilt { transform: rotate(-3deg); }
  .bar { height: 18px; border-radius: 9px; background: #e9e9e9; }
  .box { height: 64px; border-radius: 16px; border: 3px solid #ececec; }
  .opt { height: 72px; border-radius: 18px; border: 3px solid #ececec; display: flex; align-items: center; padding: 0 20px; gap: 14px; }
  .opt i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #d4d4d4; flex: none; }
  .opt .bar { flex: 1; height: 14px; }
  .opt.on { background: #f2faf6; border-color: #0c8c5e; }
  .opt.on i { border: 0; background: #0c8c5e; display: grid; place-items: center; }
  .opt.on i svg { width: 16px; height: 16px; }
  .btn { height: 72px; border-radius: 18px; background: #0c8c5e; }
  .ok { width: 64px; height: 64px; border-radius: 50%; background: #0c8c5e; border: 5px solid #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(12,140,94,.4); }
  .ok svg { width: 34px; height: 34px; }
  .av { border-radius: 50%; background: #efeaff; color: #8b74e8; display: grid; place-items: center; }
  .av svg { width: 60%; height: 60%; }
  .av.g { background: #0c8c5e; color: #fff; }
</style>
</head>
<body>
<div class="cover" id="cover"><div class="dots"></div>
  <div class="blob" style="width:900px;height:900px;left:-250px;top:-420px"></div>
  <div class="blob" style="width:700px;height:700px;right:-200px;bottom:-380px"></div>
  <div class="stage" id="scene"></div>
</div>
<script>
  const D = JSON.parse(decodeURIComponent(location.hash.slice(1) || "%7B%7D"));
  const THEMES = {
    forms:      { bg: "#0c8c5e", accent: "#c9f27a", soft: "rgba(255,255,255,.12)", line: "#ffffff" },
    mint:       { bg: "#e3f4ec", accent: "#0c8c5e", soft: "rgba(12,140,94,.10)",   line: "#0c8c5e" },
    scheduling: { bg: "#e2effd", accent: "#1e4f9a", soft: "rgba(30,79,154,.10)",   line: "#1e4f9a" },
    routing:    { bg: "#101412", accent: "#3ee08f", soft: "rgba(255,255,255,.07)", line: "#ffffff" },
    followup:   { bg: "#ffe9cc", accent: "#c2410c", soft: "rgba(194,65,12,.10)",   line: "#c2410c" },
  };
  const cat = (D.category || "").toLowerCase();
  const themeName = cat === "scheduling" ? "scheduling" : cat === "routing" ? "routing" : cat === "workflows" ? "followup"
    : cat === "integrations" ? "mint" : /alternative/i.test(D.title || "") ? "mint" : "forms";
  const T = THEMES[themeName];
  for (const [k, v] of Object.entries(T)) document.getElementById("cover").style.setProperty("--" + k, v);

  const CHECK = '<svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PERSON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" fill="currentColor"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="currentColor"/></svg>';
  const ok = (style) => `<div class="ok" style="position:absolute;${style}">${CHECK}</div>`;

  const scenes = {
    form: () => `<div class="card tilt" style="width:620px;padding:52px">
      <div class="bar" style="width:55%;height:24px;background:#d9d9d9"></div>
      <div class="bar" style="width:30%;margin-top:40px"></div><div class="box" style="margin-top:16px"></div>
      <div class="bar" style="width:40%;margin-top:34px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
        <div class="opt"><i></i><span class="bar"></span></div><div class="opt on"><i>${CHECK}</i><span class="bar" style="background:#bfe6d3"></span></div>
        <div class="opt"><i></i><span class="bar"></span></div><div class="opt"><i></i><span class="bar"></span></div></div>
      <div class="btn" style="margin-top:36px"></div>${ok("right:-30px;top:-30px")}</div>`,

    meeting: () => {
      let cells = "";
      for (let i = 0; i < 28; i++) {
        const bg = i === 16 ? "#0c8c5e" : [9, 10, 15, 17, 22, 23].includes(i) ? "#e3f4ec" : "#f3f3f3";
        cells += `<div style="height:52px;border-radius:14px;background:${bg}"></div>`;
      }
      const slots = ["border:3px solid #ececec", "background:#0c8c5e", "border:3px solid #ececec", "border:3px dashed #e3e3e3"]
        .map((s) => `<div style="height:64px;border-radius:16px;${s}"></div>`).join("");
      return `<div class="card tilt" style="width:700px;padding:52px">
        <div style="display:flex;justify-content:space-between;align-items:center"><div class="bar" style="width:40%;height:24px;background:#d9d9d9"></div>
        <div style="display:flex;gap:12px"><div class="bar" style="width:36px;height:36px;border-radius:12px"></div><div class="bar" style="width:36px;height:36px;border-radius:12px"></div></div></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:36px">${cells}</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px">${slots}</div>${ok("right:-30px;top:-30px")}</div>`;
    },

    logic: () => `<svg width="1600" height="840" style="position:absolute;inset:0">
        <path d="M630 420 C 800 420, 800 260, 1000 260" stroke="var(--line)" stroke-opacity=".35" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 22"/>
        <path d="M630 420 C 800 420, 800 580, 1000 580" stroke="var(--accent)" stroke-width="12" fill="none" stroke-linecap="round"/></svg>
      <div class="card tilt" style="width:320px;padding:36px;position:absolute;left:310px;top:330px">
        <div class="bar" style="width:60%;height:20px;background:#d9d9d9"></div>
        <div class="opt on" style="margin-top:22px;height:60px"><i>${CHECK}</i><span class="bar" style="background:#bfe6d3"></span></div>
        <div class="opt" style="margin-top:12px;height:60px"><i></i><span class="bar"></span></div></div>
      <div class="card" style="width:300px;height:170px;padding:32px;position:absolute;left:1000px;top:175px;opacity:.55">
        <div class="bar" style="width:70%"></div><div class="bar" style="width:45%;margin-top:18px"></div></div>
      <div class="card" style="width:300px;height:170px;padding:32px;position:absolute;left:1000px;top:495px">
        <div class="bar" style="width:70%"></div><div class="bar" style="width:45%;margin-top:18px"></div>${ok("right:-26px;top:-26px")}</div>`,

    integration: () => `<div style="display:flex;align-items:center;gap:70px">
      <div class="card tilt" style="width:440px;padding:44px">
        <div class="bar" style="width:55%;height:22px;background:#d9d9d9"></div>
        <div class="box" style="margin-top:28px"></div><div class="box" style="margin-top:16px"></div>
        <div class="btn" style="margin-top:28px"></div></div>
      <svg width="140" height="60" viewBox="0 0 140 60"><path d="M6 30h110M96 10l24 20-24 20" stroke="var(--accent)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="card" style="width:440px;padding:44px;transform:rotate(2deg)">
        <div style="display:flex;gap:22px;align-items:center"><div class="av" style="width:96px;height:96px">${PERSON}</div>
        <div style="flex:1"><div class="bar" style="width:80%;height:22px;background:#d9d9d9"></div><div class="bar" style="width:50%;margin-top:14px"></div></div></div>
        <div class="bar" style="margin-top:34px"></div><div class="bar" style="width:70%;margin-top:16px"></div>${ok("right:-28px;top:-28px")}</div></div>`,

    route: () => {
      const ys = [170, 420, 670];
      const lines = ys.map((y, i) => i === 1
        ? `<path d="M560 420 C 800 420, 800 ${y}, 1040 ${y}" stroke="var(--accent)" stroke-width="12" fill="none" stroke-linecap="round"/>`
        : `<path d="M560 420 C 800 420, 800 ${y}, 1040 ${y}" stroke="var(--line)" stroke-opacity=".25" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 20"/>`).join("");
      const avs = ys.map((y, i) => { const on = i === 1, s = on ? 170 : 130;
        return `<div class="av${on ? " g" : ""}" style="position:absolute;left:${on ? 1040 : 1050}px;top:${y - s / 2}px;width:${s}px;height:${s}px;${on ? "box-shadow:0 0 0 14px rgba(62,224,143,.25)" : "opacity:.7"}">${PERSON}</div>`; }).join("");
      return `<svg width="1600" height="840" style="position:absolute;inset:0">${lines}</svg>
        <div class="card tilt" style="position:absolute;left:180px;top:270px;width:380px;padding:40px">
          <div style="display:flex;gap:18px;align-items:center"><div class="av" style="width:80px;height:80px">${PERSON}</div>
          <div style="flex:1"><div class="bar" style="width:80%;height:20px;background:#d9d9d9"></div><div class="bar" style="width:55%;margin-top:12px"></div></div></div>
          <div class="bar" style="margin-top:28px"></div><div class="bar" style="width:65%;margin-top:14px"></div></div>${avs}`;
    },

    robin: () => {
      const cx = 800, cy = 420, r = 250, rad = (a) => (a * Math.PI) / 180;
      const pt = (a) => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
      const [x1, y1] = pt(-80), [x2, y2] = pt(-10);
      let out = `<svg width="1600" height="840" style="position:absolute;inset:0">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-opacity=".18" stroke-width="10" stroke-dasharray="4 26" stroke-linecap="round"/>
        <path d="M${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}" stroke="var(--accent)" stroke-width="14" fill="none" stroke-linecap="round"/></svg>`;
      [-90, 0, 90, 180].forEach((a, i) => { const [x, y] = pt(a), on = i === 1, s = on ? 190 : 140;
        out += `<div class="av${on ? " g" : ""}" style="position:absolute;left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px;${on ? "box-shadow:0 0 0 16px rgba(62,224,143,.25)" : ""}">${PERSON}</div>`; });
      return out + `<div class="ok" style="position:absolute;left:${cx - 50}px;top:${cy - 50}px;width:100px;height:100px">${CHECK}</div>`;
    },

    workflow: () => `<div class="card tilt" style="width:760px;padding:56px">
      <div style="display:flex;gap:22px;align-items:center"><div class="av" style="width:84px;height:84px">${PERSON}</div>
      <div style="flex:1"><div class="bar" style="width:45%;height:22px;background:#d9d9d9"></div><div class="bar" style="width:30%;margin-top:14px"></div></div></div>
      <div class="bar" style="margin-top:44px"></div><div class="bar" style="width:92%;margin-top:18px"></div>
      <div class="bar" style="width:96%;margin-top:18px"></div><div class="bar" style="width:60%;margin-top:18px"></div>
      <div style="display:flex;gap:16px;margin-top:44px"><div class="btn" style="width:220px;background:var(--accent)"></div><div class="btn" style="width:160px;background:#f2f2f2"></div></div>
      ${ok("right:-30px;top:-30px;background:var(--accent)")}</div>`,
  };
  scenes.responses = scenes.route;
  const kind = { check: "responses" }[D.kind] || D.kind || "form";
  document.getElementById("scene").innerHTML = (scenes[kind] || scenes.form)();
  document.body.dataset.ready = "1";
</script>
</body>
</html>
