<!doctype html>
<!-- The blog's cover template (1200 x 630, the size link previews use), in the home page's style: pure visuals, no
     words of its own. An app window from the product floats on the field of soft green tiles. tools/blog-cover.mjs fills it from JSON in the address's hash: {title, category, kind, logo, name}.
     Kinds (the window's scene): form, meeting, workflow, integration, responses. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=block">
<style>
  :root { --paper: #fafaf5; --ink: #0f0f0f; --text: #171717; --body: #3a3a38; --muted: #737373; --faint: #a3a3a3; --line: #ebebeb; --green: #0c8c5e; --green-d: #0a7a52; --green-soft: #e3f4ec; --green-ink: #086444; --brand: #333333; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
  .cover { position: relative; width: 1200px; height: 630px; }
  /* The field of soft green tiles, as on the home page */
  .field { position: absolute; inset: 0; overflow: hidden; background: #f1f8f4; display: grid; grid-template-columns: repeat(24, 1fr); grid-auto-rows: 50px; }
  .field i { display: block; }
  /* The app window */
  .win { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1.18); width: 560px; max-height: 450px; border-radius: 18px; background: #fff; box-shadow: 0 30px 60px -24px rgba(5, 60, 40, .28), 0 12px 24px -12px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.07); overflow: hidden; display: flex; flex-direction: column; }
  .bar { flex: none; height: 44px; display: flex; align-items: center; gap: 7px; padding: 0 16px; background: #fbfbfa; border-bottom: 1px solid var(--line); }
  .bar i { width: 11px; height: 11px; border-radius: 99px; }
  .bar .url { margin-left: 34px; flex: 1; height: 26px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; font-size: 12.5px; color: var(--body); }
  .body { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 14px; background: #fff; }
  .tabs { display: flex; gap: 6px; }
  .tab { height: 30px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--body); box-shadow: 0 0 0 1px var(--line); }
  .tab.on { background: var(--green-soft); color: var(--green-ink); box-shadow: 0 0 0 1px rgba(12,140,94,.25); }
  h3 { font-size: 19px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink); }
  .q { font-size: 14px; font-weight: 500; color: var(--text); }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .opt { height: 40px; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .opt b { width: 14px; height: 14px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px #c9c9c9; }
  .opt.on { box-shadow: 0 0 0 1.5px var(--green); background: #f6fbf8; }
  .opt.on b { box-shadow: inset 0 0 0 4px var(--green); }
  .time { height: 40px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .time.on { background: var(--green-d); color: #fff; box-shadow: none; }
  .time.off { color: var(--faint); text-decoration: line-through; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 500; box-shadow: 0 0 0 1px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.4); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12.5px; color: var(--text); }
  .cal span { height: 30px; display: grid; place-items: center; border-radius: 99px; }
  .cal .h { color: var(--faint); font-size: 11.5px; height: 20px; }
  .cal .on { background: var(--green-d); color: #fff; font-weight: 600; }
  .cal .free { background: var(--green-soft); color: var(--green-ink); font-weight: 500; }
  .step { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); font-size: 14.5px; font-weight: 500; color: var(--text); }
  .step .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: #f5f5f4; color: var(--muted); }
  .step svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .step small { margin-left: auto; font-size: 12.5px; color: var(--faint); font-weight: 500; }
  .step.done .ic { background: var(--green-soft); color: var(--green); }
  .step.done small { color: var(--green-ink); }
  .vline { width: 2px; height: 10px; margin: -8px 0 -8px 28px; background: var(--line); }
  .tool { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); }
  .tool .t { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 500; }
  .tool .lg { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); background: #fff; }
  .tool .lg img, .tool .lg svg { width: 18px; height: 18px; object-fit: contain; }
  .tag { align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; }
  .tag.g { background: var(--green-soft); color: var(--green-ink); } .tag.n { background: #f0f0ee; color: var(--muted); } .tag.b { background: #e8f0fe; color: #1f4fbf; } .tag.o { background: #fdf0e3; color: #a24f0b; } .tag.p { background: #f1ebfd; color: #6234c4; }
  .tbl { display: flex; flex-direction: column; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
  .tr { display: grid; grid-template-columns: 1.1fr 1.2fr 1fr; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--text); }
  .tr .tag { justify-self: start; align-self: center; }
  .tr:first-child { border-top: 0; height: 38px; background: #fbfbfa; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .who { display: inline-flex; align-items: center; gap: 7px; }
  .who i { width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 600; color: #fff; }
</style>
</head>
<body>
<div class="cover">
  <div class="field" id="field"></div>
  <div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="url" id="url">app.tryclaritia.com</span></div><div class="body" id="scene"></div></div>
</div>
<script>
  const D = JSON.parse(decodeURIComponent(location.hash.slice(1) || "%7B%7D"));
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const ICON = {
    form: '<path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    flow: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v3a4 4 0 0 0 4 4h5.5"/>',
    plug: '<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0V8zM12 16v5"/>',
    table: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
  const kind = { check: "responses" }[D.kind] || D.kind || "responses";
  const MARK = '<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#0C8C5E"/><rect x="9" y="10" width="13" height="7" rx="3.5" fill="#fff" fill-opacity=".32"/><rect x="26" y="10" width="13" height="7" rx="3.5" fill="#fff" fill-opacity=".32"/><rect x="9" y="20.5" width="13" height="7" rx="3.5" fill="#fff" fill-opacity=".32"/><rect x="26" y="20.5" width="13" height="7" rx="3.5" fill="#fff"/><rect x="9" y="31" width="13" height="7" rx="3.5" fill="#fff" fill-opacity=".32"/><rect x="26" y="31" width="13" height="7" rx="3.5" fill="#fff" fill-opacity=".32"/></svg>';
  const scenes = {
    form: () => `<div class="tabs"><span class="tab on">Form</span><span class="tab">On submission</span><span class="tab">Follow-ups</span></div>
      <h3>${esc(D.form || "Book a demo")}</h3><div class="q">How big is your team?</div>
      <div class="g2"><div class="opt"><b></b>Just me</div><div class="opt on"><b></b>2 to 10</div><div class="opt"><b></b>11 to 50</div><div class="opt"><b></b>51 or more</div></div>
      <div class="q">Pick a time</div><div class="g4"><div class="time">9:00</div><div class="time on">10:30</div><div class="time">13:00</div><div class="time">15:30</div></div>`,
    meeting: () => { let d = ""; for (let i = 0; i < 28; i++) { const n = i + 3, c = n === 12 ? "on" : [10, 11, 13, 16, 17, 18, 19].includes(n) ? "free" : ""; d += `<span class="${c}">${n <= 30 ? n : ""}</span>`; }
      return `<h3>Intro call, 30 min</h3><div class="cal">${"MTWTFSS".split("").map((x) => `<span class="h">${x}</span>`).join("")}${d}</div>
      <div class="g4"><div class="time off">9:30</div><div class="time on">10:00</div><div class="time">11:30</div><div class="time">14:00</div></div>`; },
    workflow: () => `<h3>New demo request</h3>
      <div class="step"><span class="ic">${svg("form")}</span>Form filled<small>Now</small></div><div class="vline"></div>
      <div class="step"><span class="ic">${svg("clock")}</span>Wait 1 hour<small>Done</small></div><div class="vline"></div>
      <div class="step done"><span class="ic">${svg("mail")}</span>Follow-up sent<small>Sent</small></div><div class="vline"></div>
      <div class="step"><span class="ic">${svg("cal")}</span>Reminder before the call<small>Next</small></div>`,
    integration: () => { const other = D.logo ? `<img src="${esc(D.logo)}" alt="">` : MARK;
      return `<h3>Integrations</h3><div class="g2">
      <div class="tool"><div class="t"><span class="lg">${other}</span>${esc(D.name || "Your CRM")}</div><span class="tag g">Connected</span></div>
      <div class="tool"><div class="t"><span class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/></svg></span>Google Calendar</div><span class="tag g">Connected</span></div>
      <div class="tool"><div class="t"><span class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#2d8cff" stroke-width="2"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="m15 11 6-3v8l-6-3"/></svg></span>Zoom</div><span class="tag g">Connected</span></div>
      <div class="tool"><div class="t"><span class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><path d="M8 7a3 3 0 1 1 4.6 2.5L15 14M5.5 13a3 3 0 1 0 3 4.5H14M14 17.5a3 3 0 1 0 1-5.5"/></svg></span>Webhooks</div><span class="tag n">Not connected</span></div></div>`; },
    responses: () => { const p = (i, c, n) => `<span class="who"><i style="background:${c}">${i}</i>${n}</span>`;
      return `<div class="tabs"><span class="tab on">Responses</span><span class="tab">Sort</span><span class="tab">Filter</span></div><div class="tbl">
      <div class="tr"><span>Name</span><span>Booked with</span><span>Next step</span></div>
      <div class="tr"><span>Priya Raman</span>${p("MO", "#0c8c5e", "Maya Ortiz")}<span class="tag g">Booked</span></div>
      <div class="tr"><span>Jonas Weber</span>${p("LK", "#2f6fdf", "Lena Koch")}<span class="tag g">Booked</span></div>
      <div class="tr"><span>Ana Souza</span>${p("SB", "#c2410c", "Sam Brooks")}<span class="tag o">Needs a deposit</span></div>
      <div class="tr"><span>Mei Tanaka</span>${p("LK", "#2f6fdf", "Lena Koch")}<span class="tag p">Follow-up drafted</span></div>
      <div class="tr"><span>Omar Haddad</span>${p("SB", "#c2410c", "Sam Brooks")}<span class="tag g">Booked</span></div></div>`; },
  };
  document.getElementById("scene").innerHTML = (scenes[kind] || scenes.responses)();
  // The tiles: a seeded pattern from the title, so a post's cover never changes when it's drawn again.
  let seed = 0; for (const ch of D.title || "") seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const field = document.getElementById("field");
  for (let i = 0; i < 24 * 13; i++) { const r = rnd(); const a = r < 0.45 ? 0 : r < 0.75 ? 0.08 : r < 0.92 ? 0.16 : 0.3; const t = document.createElement("i"); t.style.background = a ? `rgba(12,140,94,${a})` : "transparent"; field.append(t); }
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
